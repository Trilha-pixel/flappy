<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Flappy Pix - Mentoria Tech House ForFy</title>
  <meta name="viewport" content="width=device-width">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #87CEEB 0%, #FF8C00 100%);
    }

    #screen canvas {
      margin: 0 auto;
    }

    #github {
      position: absolute;
      bottom: 5px;
      right: 5px;
    }

    #loading {
      position: absolute;
      font-family: "Verdana";
      width: 100%;
      text-align: center;
      color: white;
      font-size: 24px;
      top: 50%;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    #banner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .banner-content {
      background: #fff;
      border: 6px solid #000;
      padding: 20px;
      max-width: 90%;
      width: 320px;
      text-align: center;
      font-family: 'Verdana', sans-serif;
      box-shadow: 0 0 0 4px #FFD700, 0 0 0 8px #000;
    }

    .banner-content h1 {
      color: #e74c3c;
      font-size: 24px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .banner-content p {
      font-size: 16px;
      line-height: 1.4;
      color: #333;
      margin-bottom: 20px;
    }

    .banner-content .highlight {
      color: #27ae60;
      font-weight: bold;
      font-size: 1.2em;
    }

    .banner-content .limit-badge {
      display: inline-block;
      background: #e67e22;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .banner-btn {
      background: #2ecc71;
      color: white;
      border: 4px solid #27ae60;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s;
    }

    .banner-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <div id="banner-overlay">
    <div class="banner-content">
      <h1>💸 Jogue e Ganhe!</h1>
      <p>No <strong>Flappy Pix</strong>, cada cano que você ultrapassa vale <span class="highlight">R$ 0,50</span>
        diretamente no seu saldo!</p>
      <div class="limit-badge">⚠️ APENAS 3 TENTATIVAS restantes</div>
      <p>Você tem talento para faturar alto hoje?</p>
      <button class="banner-btn" id="start-game-btn" onclick="fecharBanner()">COMEÇAR AGORA!</button>
    </div>
  </div>
  <script>
    window.fecharBanner = function () {
      const banner = document.getElementById('banner-overlay');
      if (banner) {
        banner.style.display = 'none';
        console.log('✅ Banner fechado pelo usuário');
        // Sincronizar com o jogo se ele já carregou
        if (window.gameInstance && typeof window.gameInstance.clickBanner === 'function') {
          window.gameInstance.clickBanner();
        } else {
          window.bannerClicadoAntes = true;
        }
      }
    };
  </script>
  <div id="loading">Carregando Flappy Pix...</div>
  <div id="screen"></div>
  <div id="github"></div>
  <script src="index.min.js?v=flappypix_v4"></script>
  <script>
    // Flappy Pix - Sistema Mobile-First (sem botão de saque)
    console.log('🎮 FLAPPY PIX - Sistema mobile ativo!');
    console.log('💰 Saldo salvo no localStorage');
  </script>
  <script>
    (function (i, s, o, g, r, a, m) {
      i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () {
        (i[r].q = i[r].q || []).push(arguments)
      }, i[r].l = 1 * new Date(); a = s.createElement(o),
        m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m)
    })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga');
    if (document.domain === 'hyspace.io') {
      ga('create', 'UA-21699184-3', 'hyspace.io');
      ga('send', 'pageview');
    }
  </script>

</html>
